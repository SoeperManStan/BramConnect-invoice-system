name: Validate invoice examples

on:
  push:
    paths:
      - 'examples/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Show node + npm
        run: |
          node -v
          npm -v
      
      - name: Validate examples (pinned @ajv/cli via npx)
        run: |
          npx -y @ajv/cli@4.0.0 --version
          npx -y @ajv/cli@4.0.0 validate -s schema/invoice.v1.json -d "examples/*.json"
